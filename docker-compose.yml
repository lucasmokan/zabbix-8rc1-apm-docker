name: zabbix8

services:
  postgres:
    image: postgres:${POSTGRES_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zbx]

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_TAG}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: zabbix
      CLICKHOUSE_USER: zabbix
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    cap_add: [SYS_NICE, NET_ADMIN, IPC_LOCK]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ch_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zbx]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZBX_TAG}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
      # Mesma sintaxe do HistoryProvider do zabbix_server.conf
      ZBX_HISTORYPROVIDER_0: >-
        clickhouse;value_types="uint,dbl,str,log,text,json",url=http://clickhouse:8123,db=zabbix,username=zabbix,password=${CLICKHOUSE_PASSWORD}
      TZ: ${TZ}
    ports:
      - "10051:10051"
    networks: [zbx]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZBX_TAG}
    restart: unless-stopped
    depends_on: [zabbix-server]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
      PHP_TZ: ${TZ}
      # Um unico objeto JSON (nao array), espelhando o provider do server
      ZBX_HISTORYPROVIDERS: >-
        {"types":["uint","dbl","str","log","text","json"],"provider":"clickhouse","url":"http://clickhouse:8123","db":"zabbix","username":"zabbix","password":"${CLICKHOUSE_PASSWORD}"}
    ports:
      - "${WEB_PORT}:8080"
    networks: [zbx]

  zabbix-agent:
    image: zabbix/zabbix-agent2:${ZBX_TAG}
    restart: unless-stopped
    depends_on: [zabbix-server]
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server
      TZ: ${TZ}
    networks: [zbx]

volumes:
  pg_data:
  ch_data:

networks:
  zbx:
